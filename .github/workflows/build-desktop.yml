name: Build desktop packages

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
    secrets:
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_TEAM_ID:
        required: false
      WINDOWS_CERTIFICATE:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false

jobs:
  build-binaries:
    name: desktop binaries (${{ join(matrix.targets, ', ') }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.plan).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi

      - name: Mark official release build
        if: ${{ !fromJson(inputs.plan).announcement_tag_is_implicit }}
        shell: bash
        run: echo "ORX_OFFICIAL_RELEASE_BUILD=1" >> "$GITHUB_ENV"

      - name: Install dist
        run: ${{ matrix.install_dist.run }}

      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}

      - name: Build release binaries
        shell: bash
        run: dist build --artifacts=local --target="${{ matrix.targets[0] }}"

      - name: Upload desktop binaries
        uses: actions/upload-artifact@v7
        with:
          name: desktop-binaries-${{ join(matrix.targets, '_') }}
          path: |
            target/distrib/openresearch-cli-${{ matrix.targets[0] }}.tar.xz
            target/distrib/openresearch-cli-${{ matrix.targets[0] }}.tar.gz
            target/distrib/openresearch-cli-${{ matrix.targets[0] }}.zip

  package:
    name: desktop package (${{ join(matrix.targets, ', ') }})
    needs: build-binaries
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.plan).ci.github.artifacts_matrix }}
    runs-on: ${{ contains(matrix.targets[0], '-pc-windows-') && 'windows-2022' || matrix.runner }}
    container: ${{ !contains(matrix.targets[0], '-pc-windows-') && matrix.container && matrix.container.image || null }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Download desktop binaries
        uses: actions/download-artifact@v8
        with:
          name: desktop-binaries-${{ join(matrix.targets, '_') }}
          path: target/distrib

      - name: Install desktop packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Require macOS release signing credentials
        if: ${{ !fromJson(inputs.plan).announcement_tag_is_implicit && contains(matrix.targets[0], '-apple-darwin') }}
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_PASSWORD"
          test -n "$APPLE_SIGNING_IDENTITY"
          test -n "$APPLE_TEAM_ID"

      - name: Require Windows release signing credentials
        if: ${{ !fromJson(inputs.plan).announcement_tag_is_implicit && contains(matrix.targets[0], '-pc-windows-') }}
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$WINDOWS_CERTIFICATE"
          test -n "$WINDOWS_CERTIFICATE_PASSWORD"

      - name: Import Windows signing certificate
        if: ${{ !fromJson(inputs.plan).announcement_tag_is_implicit && contains(matrix.targets[0], '-pc-windows-') }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            exit 0
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "openresearch-certificate.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Remove-Item $certificatePath

      - name: Build desktop package
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ !fromJson(inputs.plan).announcement_tag_is_implicit && contains(matrix.targets[0], '-apple-darwin') && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ !fromJson(inputs.plan).announcement_tag_is_implicit && contains(matrix.targets[0], '-apple-darwin') && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ !fromJson(inputs.plan).announcement_tag_is_implicit && contains(matrix.targets[0], '-apple-darwin') && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ !fromJson(inputs.plan).announcement_tag_is_implicit && contains(matrix.targets[0], '-apple-darwin') && secrets.APPLE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ !fromJson(inputs.plan).announcement_tag_is_implicit && contains(matrix.targets[0], '-apple-darwin') && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_TEAM_ID: ${{ !fromJson(inputs.plan).announcement_tag_is_implicit && contains(matrix.targets[0], '-apple-darwin') && secrets.APPLE_TEAM_ID || '' }}
        run: scripts/package-desktop.sh "${{ matrix.targets[0] }}"

      - name: Upload desktop package
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-desktop-${{ join(matrix.targets, '_') }}
          path: target/desktop/*
